name: Deploy Backend to Armbian

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'data/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'docker-compose.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared & Setup SSH
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat << 'EOF' > ~/.ssh/config
          Host ${{ secrets.SSH_HOST }}
              User sa
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Deploy Backend via SSH Proxy
        env:
          TERM: dumb
        run: |
          ssh -T sa@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            echo "=== [1/3] Pulling latest changes ==="
            cd /sd/stacks/blooket/backend
            git pull origin main

            echo "=== [2/3] Restarting container ==="
            docker restart blooket-api

            echo "=== [3/3] Verifying health ==="
            for i in $(seq 1 15); do
              if curl -s http://127.0.0.1:3015/api/v1/health | grep -q "ok"; then
                echo "Backend is healthy and running!"
                exit 0
              fi
              echo "Waiting for backend to be ready ($i/15)..."
              sleep 2
            done
            echo "Health check timed out!"
            exit 1
          EOF

      - name: Send Email Notification on Failure
        if: failure() && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[FAILED] ${{ github.repository }} - ${{ github.workflow }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch / Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
