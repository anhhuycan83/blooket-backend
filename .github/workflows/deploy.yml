name: Deploy Backend to Armbian

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'data/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'docker-compose.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared & Setup SSH
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat << 'EOF' > ~/.ssh/config
          Host ${{ secrets.SSH_HOST }}
              User sa
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Deploy Backend via SSH Proxy
        env:
          TERM: dumb
        run: |
          ssh -T sa@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            echo "=== [1/4] Pulling latest changes ==="
            cd /sd/stacks/blooket/backend
            PREV_REV=$(git rev-parse HEAD)
            git pull origin main
            NEW_REV=$(git rev-parse HEAD)

            echo "=== [2/4] Updating container ==="
            if git diff --name-only "$PREV_REV" "$NEW_REV" | grep -qE '^(src/|package\.json|tsconfig\.json|Dockerfile)'; then
              echo "Code changes detected -> rebuilding blooket-api container..."
              if docker compose version >/dev/null 2>&1; then
                docker compose up -d --no-deps --build blooket-api
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose up -d --no-deps --build blooket-api
              else
                docker restart blooket-api
              fi
            else
              echo "Data-only changes -> restarting blooket-api..."
              docker restart blooket-api
            fi

            echo "=== [3/4] Verifying health ==="
            for i in $(seq 1 15); do
              if curl -s http://127.0.0.1:3015/api/v1/health | grep -q "ok"; then
                echo "Backend is healthy and running!"
                exit 0
              fi
              echo "Waiting for backend to be ready ($i/15)..."
              sleep 2
            done
            echo "Health check timed out!"
            exit 1
          EOF
